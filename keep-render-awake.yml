name: Keep BRVM Render Awake

on:
  schedule:
    # 10:00 à 15:55, lundi-vendredi
    - cron: "*/5 10-15 * * 1-5"
      timezone: "Africa/Porto-Novo"

    # 16:00 à 16:30, lundi-vendredi
    - cron: "0-30/5 16 * * 1-5"
      timezone: "Africa/Porto-Novo"

  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping BRVM collector
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            "https://sraping-brvm-data.onrender.com/health"